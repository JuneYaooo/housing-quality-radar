<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">工作流程</title>
  <desc id="desc">你的找房要求，经过读取帖子与账号、同口径计算和风险检查，输出优先看房清单</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9AA8A3"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="#FBF8F2"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <g transform="translate(40 50)">
      <rect width="250" height="200" rx="14" fill="#FFFFFF" stroke="#E2DCCF"/>
      <text x="24" y="40" fill="#9AA8A3" font-size="14" font-weight="700" letter-spacing="2">01 输入</text>
      <text x="24" y="76" fill="#16202A" font-size="22" font-weight="700">你的找房要求</text>
      <text x="24" y="112" fill="#56635F" font-size="16">区域或小区、预算</text>
      <text x="24" y="140" fill="#56635F" font-size="16">户型、楼层、入住时间</text>
      <text x="24" y="168" fill="#56635F" font-size="16">也可直接给链接或截图</text>
    </g>
    <g transform="translate(330 50)">
      <rect width="250" height="200" rx="14" fill="#FFFFFF" stroke="#E2DCCF"/>
      <text x="24" y="40" fill="#9AA8A3" font-size="14" font-weight="700" letter-spacing="2">02 读取</text>
      <text x="24" y="76" fill="#16202A" font-size="22" font-weight="700">帖子与发布账号</text>
      <text x="24" y="112" fill="#56635F" font-size="16">正文、图片和评论</text>
      <text x="24" y="140" fill="#56635F" font-size="16">账号主页与历史帖子</text>
      <text x="24" y="168" fill="#56635F" font-size="16">只读，不私信不点赞</text>
    </g>
    <g transform="translate(620 50)">
      <rect width="250" height="200" rx="14" fill="#FFFFFF" stroke="#E2DCCF"/>
      <text x="24" y="40" fill="#9AA8A3" font-size="14" font-weight="700" letter-spacing="2">03 计算与检查</text>
      <text x="24" y="76" fill="#16202A" font-size="22" font-weight="700">同口径比较</text>
      <text x="24" y="112" fill="#56635F" font-size="16">面积口径、单价、月均成本</text>
      <text x="24" y="140" fill="#56635F" font-size="16">同类报价可比分级</text>
      <text x="24" y="168" fill="#56635F" font-size="16">报价冲突、付款条款</text>
    </g>
    <g transform="translate(910 50)">
      <rect width="250" height="200" rx="14" fill="#1F7A6B"/>
      <text x="24" y="40" fill="#BFE0D8" font-size="14" font-weight="700" letter-spacing="2">04 输出</text>
      <text x="24" y="76" fill="#FFFFFF" font-size="22" font-weight="700">找房报告</text>
      <text x="24" y="112" fill="#E6F3F0" font-size="16">先看哪几套、为什么</text>
      <text x="24" y="140" fill="#E6F3F0" font-size="16">原帖链接与报价对照</text>
      <text x="24" y="168" fill="#E6F3F0" font-size="16">风险提示与待确认问题</text>
    </g>
    <line x1="294" y1="150" x2="324" y2="150" stroke="#9AA8A3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="584" y1="150" x2="614" y2="150" stroke="#9AA8A3" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="874" y1="150" x2="904" y2="150" stroke="#9AA8A3" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
